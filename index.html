<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>U-MA Escalas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Escalas de piano con arpegios, digitaciones y armonizaciones. U-MA サウンド">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Music&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@900&text=%E3%82%B5%E3%82%A6%E3%83%B3%E3%83%89&display=swap" rel="stylesheet">
<style>
/* Layout: hoja técnica Norns Sound Creator — placa U-MA + scope arriba, secciones-ficha numeradas (papel / tinta / amarillo / magenta), transporte fijo abajo como el teclado de NSC */
:root{
  --bg:#C8C9C5; --paper:#F0EFEA; --paperFg:#141414; --paperLine:rgba(20,20,20,.22); --paperMute:#5E5E5A;
  --ink:#121314; --mag:#D12F7D; --cya:#2A9EBF; --yel:#E1C43B;
  --disp:"Barlow Condensed","Noto Sans JP","Noto Music",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Noto Music",monospace;
  --music:"Noto Music","IBM Plex Mono",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; color-scheme:dark; } }
:root[data-theme="dark"]{ --bg:#08090A; --paper:#1C1D1F; --paperFg:#EAE8E2; --paperLine:rgba(255,255,255,.16); --paperMute:#9B9A95; --ink:#000; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--paperFg); font:14px/1.45 var(--mono); -webkit-tap-highlight-color:transparent; overflow-x:hidden;
  padding-left:max(10px,env(safe-area-inset-left,0px)); padding-right:max(10px,env(safe-area-inset-right,0px)); padding-block:0}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer; touch-action:manipulation}
:focus-visible{outline:2px solid var(--cya); outline-offset:2px}
.app{max-width:980px; margin:0 auto; padding:0 0 calc(150px + env(safe-area-inset-bottom,0px))}

.p-paper{--pb:var(--paper); --pf:var(--paperFg); --pl:var(--paperLine); --pm:var(--paperMute); --pa:var(--mag); --pat:#fff}
.p-ink{--pb:var(--ink); --pf:#ECEBE6; --pl:rgba(255,255,255,.2); --pm:#9C9B97; --pa:var(--cya); --pat:#0B0B0B}
.p-mag{--pb:var(--mag); --pf:#101010; --pl:rgba(0,0,0,.32); --pm:rgba(0,0,0,.68); --pa:#101010; --pat:var(--mag)}
.p-yel{--pb:var(--yel); --pf:#101010; --pl:rgba(0,0,0,.3); --pm:rgba(0,0,0,.66); --pa:#101010; --pat:var(--yel)}
.panel{background:var(--pb); color:var(--pf); border:1.5px solid var(--pf); outline:1.5px solid var(--pb); position:relative}
.panel::after{content:""; position:absolute; inset:5px; border:1px solid var(--pl); pointer-events:none}
.panel>.in{padding:14px 16px 18px; position:relative; z-index:1}

.top{padding:10px 0 0}
.bar{display:flex; align-items:center; gap:8px}
.logo{height:40px; width:auto; flex:none; display:block}
.title{flex:1; min-width:0}
.title b{display:block; font:800 clamp(18px,5.4vw,26px)/.95 var(--disp); text-transform:uppercase; letter-spacing:.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.title small{display:flex; gap:10px; font:500 10.5px/1.3 var(--mono); color:var(--paperMute); text-transform:uppercase; letter-spacing:.06em; margin-top:3px; white-space:nowrap; overflow:hidden}
.iconbtn{height:36px; min-width:36px; padding:0 8px; border:1.5px solid var(--paperFg); background:var(--paper); color:var(--paperFg); display:grid; place-items:center; flex:none; font:700 12px/1 var(--mono); letter-spacing:.04em}

.scopecard{margin-top:10px}
.scopecard>.in{padding:10px 12px}
.meta{display:flex; justify-content:space-between; gap:8px; font:500 10px/1.2 var(--mono); text-transform:uppercase; letter-spacing:.08em; color:var(--pm)}
#topkb{display:block; width:100%; height:52px; margin:6px 0}
.readout{display:grid; grid-template-columns:1.6fr 1fr 1fr 1.2fr; border-top:1px solid var(--pl)}
.readout div{padding:4px 6px 0; border-left:1px solid var(--pl); min-width:0}
.readout div:first-child{border-left:0; padding-left:0}
.readout span{display:block; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.readout b{display:block; font:700 19px/1.1 var(--disp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

section{margin-top:16px}
.sh{border-bottom:1.5px solid var(--pf); margin-bottom:12px; padding-bottom:8px}
.sh .meta{margin-bottom:6px}
.shm{display:flex; align-items:flex-end; gap:8px 12px; flex-wrap:wrap}
.num{font:800 52px/.82 var(--disp); letter-spacing:-.02em; flex:none}
.shm h2{margin:0; font:700 26px/1 var(--disp); text-transform:uppercase; letter-spacing:.02em; text-wrap:balance}
.shm .aside{display:flex; gap:6px; align-items:center; flex:none; margin-left:auto}
.sq{display:flex; gap:3px; margin-bottom:4px}
.sq i{width:9px; height:9px; border:1px solid var(--pf)}
.sq i.m{background:var(--mag)} .sq i.c{background:var(--cya)} .sq i.y{background:var(--yel)}
.lbl{font:500 10.5px/1.2 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.08em; margin:14px 0 6px}
.lbl:first-child{margin-top:0}
.note{color:var(--pm); font-size:12px; margin:10px 0 0; max-width:68ch}
.hz{height:12px; margin-top:14px; background:repeating-linear-gradient(-45deg,var(--pf) 0 6px,transparent 6px 12px); border:1.5px solid var(--pf)}
.bc{display:block; height:28px; width:100%; margin-top:12px; color:var(--pf)}

.seg{display:inline-flex; border:1.5px solid var(--pf,var(--paperFg)); background:var(--pb,var(--paper)); flex:none; max-width:100%; overflow-x:auto; scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0; background:transparent; padding:7px 10px; font:600 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.04em; white-space:nowrap; min-height:34px; color:var(--pf,var(--paperFg))}
.seg button+button{border-left:1.5px solid var(--pf,var(--paperFg))}
.seg button[aria-pressed="true"]{background:var(--pf,var(--paperFg)); color:var(--pb,var(--paper))}
.btn{border:1.5px solid var(--pf,var(--paperFg)); background:var(--pb,var(--paper)); color:var(--pf,var(--paperFg)); padding:7px 11px; font:600 12px/1 var(--mono); text-transform:uppercase; letter-spacing:.04em; min-height:34px; white-space:nowrap}
.btn.acc{background:var(--pa); color:var(--pat); border-color:var(--pa)}
.btn[aria-pressed="true"]{background:var(--cya); color:#0B0B0B; border-color:var(--cya)}
.btn.sm{padding:4px 8px; min-height:28px; font-size:11px}
.row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}

/* 01 escala */
.roots{display:grid; grid-template-columns:repeat(12,1fr); border:1.5px solid var(--pf)}
.roots button{border:0; border-left:1.5px solid var(--pf); background:transparent; color:var(--pf); min-height:50px; padding:4px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; min-width:0}
.roots button:first-child{border-left:0}
.roots button b{font:700 18px/1 var(--disp)}
.roots button small{font:500 9.5px/1 var(--mono); color:var(--pm)}
.roots button.blk{background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--pl) 4px 5px)}
.roots button[aria-pressed="true"]{background:var(--mag); color:#fff}
.roots button[aria-pressed="true"] small{color:#fff}
@media (max-width:640px){ .roots{grid-template-columns:repeat(6,1fr)} .roots button:nth-child(7){border-left:0} .roots button:nth-child(n+7){border-top:1.5px solid var(--pf)} }
.seg.fams{display:grid; grid-template-columns:repeat(4,1fr); gap:4px; border:0; background:transparent; overflow:visible; width:100%}
.seg.fams button{border:1.5px solid var(--pf); white-space:normal; line-height:1.15; padding:8px 6px; text-align:center}
.seg.fams button+button{border-left:1.5px solid var(--pf)}
@media (max-width:640px){ .seg.fams{grid-template-columns:repeat(2,1fr)} }
.search{width:100%; border:1.5px solid var(--pf); background:transparent; padding:8px 10px; font:500 13px var(--mono); color:var(--pf)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; max-height:300px; overflow-y:auto; padding-right:2px; margin-top:8px}
.sc{border:1.5px solid var(--pf); background:var(--pb); color:var(--pf); text-align:left; padding:7px 8px; display:flex; flex-direction:column; gap:5px; min-height:52px}
.sc b{font:600 12.5px/1.15 var(--mono)}
.sc .dots{display:flex; gap:2px}
.sc .dots i{flex:1; height:6px; border:1px solid currentColor; opacity:.9}
.sc .dots i.on{background:currentColor}
.sc .dots i.r{background:var(--mag); border-color:var(--mag)}
.sc[aria-pressed="true"]{background:var(--paperFg); color:var(--paper); border-color:var(--paperFg)}
.sc .fam{font:500 9.5px/1 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.06em}
.sc[aria-pressed="true"] .fam{color:inherit; opacity:.7}

.sum{display:grid; grid-template-columns:1fr 230px; gap:18px; margin-top:16px; align-items:start}
.sum>div{min-width:0}
@media (max-width:700px){ .sum{grid-template-columns:1fr} .clockwrap{max-width:260px; margin:0 auto; width:100%} }
.bigname{font:800 clamp(34px,7vw,58px)/.88 var(--disp); text-transform:uppercase; letter-spacing:-.01em; text-wrap:balance; margin:0}
.bigname em{font-style:normal; color:var(--mag)}
.notes{display:flex; flex-wrap:wrap; gap:4px; margin-top:12px}
.nt{border:1.5px solid var(--pf); min-width:48px; display:flex; flex-direction:column; align-items:center; padding:4px 6px 5px}
.nt b{font:700 20px/1 var(--disp)}
.nt span{font:600 11px/1 var(--mono); color:var(--pm); margin-top:3px}
.nt.r{background:var(--mag); border-color:var(--mag); color:#fff}
.nt.r span{color:#fff}
.nt.on{background:var(--yel); border-color:var(--yel); color:#101010}
.nt.on span{color:#101010}
.steps{display:flex; margin-top:10px; border:1.5px solid var(--pf); height:34px}
.steps i{font-style:normal; display:grid; place-items:center; border-left:1.5px solid var(--pf); font:700 12px/1 var(--mono); min-width:0; overflow:hidden}
.steps i:first-child{border-left:0}
.steps i.s1{background:var(--paper); color:var(--paperFg)}
.steps i.s2{background:var(--cya); color:#0B0B0B}
.steps i.s3{background:var(--yel); color:#101010}
.steps i.s4{background:var(--mag); color:#fff}
.stepl{display:flex; justify-content:space-between; font:500 9.5px/1.2 var(--mono); color:var(--pm); letter-spacing:.08em; margin-top:4px; text-transform:uppercase; flex-wrap:wrap; gap:6px}
.stepl span{display:inline-flex; align-items:center; gap:4px}
.stepl span i{width:10px; height:10px; display:inline-block; border:1px solid var(--pf)}
#clock{display:block; width:100%; aspect-ratio:1; max-width:100%}

/* 02 teclado */
.hero{margin-top:2px}
.legend{display:flex; flex-wrap:wrap; gap:10px; font:500 10.5px/1 var(--mono); color:var(--pm); text-transform:uppercase; letter-spacing:.06em; align-items:center}
.legend span{display:inline-flex; align-items:center; gap:5px}
.fgd{width:18px; height:18px; border-radius:50%; display:inline-grid; place-items:center; font:700 11px/1 var(--mono); color:#101010}
#hero{display:block; width:100%; margin-top:10px; touch-action:manipulation}
.staffbox{background:var(--paper); color:var(--paperFg); border:1.5px solid var(--pf); margin-top:12px; overflow-x:auto}
#staff{display:block; width:100%; min-width:320px}
.ftab{margin-top:12px; overflow-x:auto; border-top:1px solid var(--pl)}
.frow{display:flex; align-items:stretch; gap:0; padding:6px 0; border-bottom:1px solid var(--pl); width:max-content; min-width:100%}
.frow>b{flex:none; width:64px; font:700 15px/1 var(--disp); text-transform:uppercase; display:flex; align-items:center}
.fcell{width:34px; flex:none; display:flex; flex-direction:column; align-items:center; gap:3px}
.fcell span{font:500 10px/1 var(--mono); color:var(--pm); white-space:nowrap}
.fcell .fgd{width:22px; height:22px; font-size:12px}
.fcell.on .fgd{outline:2px solid var(--yel); outline-offset:2px}

/* 03 arpegios / 04 armonización */
.ctl{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:flex-end}
.ctl>div{display:flex; flex-direction:column; gap:6px; min-width:0; max-width:100%}
.ctl .lbl{margin:0}
.degs{display:flex; flex-wrap:wrap; gap:4px}
.degs button{min-width:46px; border:1.5px solid var(--pf); background:transparent; color:var(--pf); padding:6px 6px; display:flex; flex-direction:column; align-items:center; gap:2px}
.degs button b{font:700 18px/1 var(--disp)}
.degs button small{font:500 10px/1 var(--mono)}
.degs button[aria-pressed="true"]{background:var(--pf); color:var(--pb)}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:8px; margin-top:14px}
.card{border:1.5px solid var(--paperFg); background:var(--paper); color:var(--paperFg); display:flex; flex-direction:column; min-width:0}
.card .hd{background:var(--c); color:var(--ct,#101010); padding:6px 8px; border-bottom:1.5px solid var(--paperFg); display:flex; align-items:baseline; gap:6px}
.card .hd .rn{font:800 30px/.9 var(--disp)}
.card .hd .fn{margin-left:auto; font:700 10px/1 var(--mono); border:1.5px solid currentColor; padding:2px 4px; letter-spacing:.06em}
.card .bd{padding:7px 8px 8px; display:flex; flex-direction:column; gap:6px}
.card .cn{font:700 20px/1 var(--disp); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .ch{font:500 10px/1.2 var(--mono); color:var(--paperMute); letter-spacing:.04em}
.card canvas{display:block; width:100%; height:46px}
.card .act{display:flex; gap:4px}
.card .act button{flex:1; border:1.5px solid var(--paperFg); background:transparent; color:var(--paperFg); font:700 12px/1 var(--mono); min-height:30px}
.card.sel{outline:3px solid var(--yel); outline-offset:1px}
.card.on .hd{background:var(--yel); color:#101010}
.qleg{display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; font:500 10.5px/1 var(--mono); text-transform:uppercase; letter-spacing:.06em; color:var(--pm)}
.qleg span{display:inline-flex; gap:5px; align-items:center}
.qleg i{width:14px; height:14px; border:1.5px solid var(--pf); display:inline-block}
.prog{display:flex; gap:6px; overflow-x:auto; padding:2px 2px 6px; margin-top:12px; min-height:94px}
.pc{flex:0 0 96px; border:1.5px solid var(--pf); background:var(--paper); color:var(--paperFg); display:flex; flex-direction:column; position:relative}
.pc .hd{background:var(--c); color:var(--ct,#101010); padding:5px 6px; border-bottom:1.5px solid var(--paperFg); font:800 26px/.9 var(--disp)}
.pc .bd{padding:5px 6px; font:700 16px/1 var(--disp)}
.pc .x{position:absolute; top:3px; right:3px; border:0; background:transparent; color:#101010; font:700 15px/1 var(--mono); width:24px; height:24px}
.pc .n{font:500 9.5px/1 var(--mono); color:var(--paperMute); padding:0 6px 5px}
.pc{transition:transform .12s}
.pc.on{outline:3px solid #101010; outline-offset:2px; transform:translateY(-4px)}
.pc.on .hd{background:var(--yel); color:#101010}
.pc.on .bd,.pc.on .n{background:#101010; color:#ECEBE6}
.pnow{display:grid; grid-template-columns:auto 1fr; gap:6px 16px; align-items:center; background:#101010; color:#ECEBE6; border:1.5px solid #101010; padding:12px 14px; margin-top:12px}
.pnow .st{grid-column:1/-1; display:flex; justify-content:space-between; gap:8px; font:500 10px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase; color:#9C9B97}
.pnow .st b{color:var(--yel); font-weight:700}
.pnow .rn{font:800 clamp(52px,12vw,80px)/.85 var(--disp); color:var(--c); min-width:1.4em}
.pnow .nmc{font:700 clamp(24px,5vw,34px)/1 var(--disp)}
.pnow .tn{font:500 12px/1.3 var(--mono); color:#9C9B97; margin-top:4px}
.pnow canvas{grid-column:1/-1; display:block; width:100%; height:54px}
.pnow .bars{grid-column:1/-1; display:flex; gap:3px}
.pnow .bars i{flex:1; height:6px; background:#2b2c2e}
.pnow .bars i.on{background:var(--yel)}
.pnow .bars i.done{background:#6b6b67}
.empty{border:1.5px dashed var(--pm); padding:18px; color:var(--pm); text-align:center; width:100%; align-self:stretch; display:grid; place-items:center}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1.5px solid var(--pf); background:transparent; color:var(--pf); padding:6px 9px; font:600 12px/1 var(--mono); min-height:34px; display:inline-flex; align-items:center; gap:6px}
.chip small{font-weight:500; opacity:.75}
.chip:hover{background:rgba(0,0,0,.12)}
.chip .live{display:none; width:9px; height:9px; border-radius:50%; background:var(--yel)}
.chip.act{background:#101010; color:#ECEBE6; border-color:#101010}
.chip.act .live{display:inline-block}
.chip.act.playing .live{animation:blink 1s steps(2) infinite}
.chip .rns span{padding:1px 2px}
.chip.act .rns span.on{background:var(--yel); color:#101010; font-weight:700}
@keyframes blink{50%{opacity:.2}}

/* transporte */
.tr{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--ink); color:#ECEBE6; border-top:1.5px solid #ECEBE6;
  padding:0 max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));
  --pb:var(--ink); --pf:#ECEBE6; --pl:rgba(255,255,255,.2); --pm:#9C9B97; --pa:var(--cya); --pat:#0B0B0B}
.tr .in2{max-width:980px; margin:0 auto; padding:8px 0 10px}
.in2{display:flex; flex-wrap:wrap; gap:6px 14px; align-items:flex-end}
.trow{display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; min-width:0}
.tr .seg button[aria-pressed="true"]{background:var(--on,#ECEBE6); color:var(--onT,#0B0B0B)}
.tr .btn[aria-pressed="true"]:not(.loopbtn){background:var(--mag); border-color:var(--mag); color:#fff}
.tg{display:flex; flex-direction:column; gap:3px; flex:none}
.trow .k{font:500 9.5px/1 var(--mono); color:var(--pm); letter-spacing:.08em; text-transform:uppercase}
.bpmg{display:flex; align-items:center; gap:4px}
.r1 .beat{align-self:center}
@media (max-width:640px){
  .in2{gap:6px; flex-direction:column; align-items:stretch}
  .trow{flex-wrap:nowrap; justify-content:space-between; gap:5px}
  .r1 .beat{display:none}
  .r2 .seg{width:100%} .r2 .seg button{flex:1; padding:6px 2px}
  .tr .seg button{padding:6px 7px; font-size:11px; min-height:32px}
  .tr .btn{padding:6px 8px; font-size:11px}
  .playbtn{min-width:76px; min-height:36px; font-size:13px}
  .loopbtn{min-height:36px}
  .bpmv{font-size:19px; min-width:28px}
  .tr .btn.sm{padding:4px 7px}
  .app{padding-bottom:calc(200px + env(safe-area-inset-bottom,0px))}
  .toast.toast{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
}
.playbtn{min-width:96px; min-height:40px; border:1.5px solid var(--cya); background:var(--cya); color:#0B0B0B; font:700 14px/1 var(--mono); letter-spacing:.06em; display:flex; align-items:center; justify-content:center; gap:8px; flex:none}
.playbtn.on{background:var(--mag); border-color:var(--mag); color:#fff}
.loopbtn{min-height:40px}
.loopbtn[aria-pressed="true"]{background:var(--yel); border-color:var(--yel); color:#101010}
.bpmv{font:700 22px/1 var(--disp); min-width:34px; text-align:center; font-variant-numeric:tabular-nums}
.beat{display:flex; gap:3px; flex:none}
.beat i{width:9px; height:9px; border:1px solid #ECEBE6}
.beat i.on{background:var(--yel); border-color:var(--yel)}
.beat i.on.a{background:var(--mag); border-color:var(--mag)}

function dpFinger(ms,hand,arp){
  const n=ms.length,INF=1e9;if(!n)return [];
  const C=ms.map(()=>Array(6).fill(INF)),P=ms.map(()=>Array(6).fill(0));
  const nodeC=(i,f)=>{let c=0;const b=isBlack(ms[i]);if(f===1&&b)c+=arp?2.5:4;if(f===5&&b)c+=0.8;
    const edge=hand==='r'?i===n-1:i===0;if(f===5&&!edge&&n>1)c+=arp?1.5:5;return c;};
  for(let f=1;f<=5;f++)C[0][f]=nodeC(0,f)+(hand==='r'?(f===1?0:f===2?1.2:2):(f===5?0:f===4?1.2:2.5));
  for(let i=1;i<n;i++){const span=Math.abs(ms[i]-ms[i-1]),bA=isBlack(ms[i-1]),bB=isBlack(ms[i]);
    for(let fb=1;fb<=5;fb++){const nc=nodeC(i,fb);
      for(let fa=1;fa<=5;fa++){if(C[i-1][fa]>=INF)continue;let t=null;
        const normal=hand==='r'?fb>fa:fb<fa;
        if(normal){const lo=Math.min(fa,fb),hi=Math.max(fa,fb),cf=COMFY[lo+','+hi]*(arp?1.15:1),skip=hi-lo-1;

        else if(hand==='r'&&fb===1&&fa>=2&&fa<=4)t=(fa===2?2.2:1)+Math.max(0,span-(arp?5:4))*2.5+(bA&&!bB?-0.7:0);
        else if(hand==='l'&&fa===1&&fb>=2&&fb<=4)t=(fb===2?2.2:1)+Math.max(0,span-(arp?5:4))*2.5+(bB&&!bA?-0.7:0);
        if(t==null)continue;const v=C[i-1][fa]+t+nc;if(v<C[i][fb]){C[i][fb]=v;P[i][fb]=fa;}}}}
  let best=1,bv=INF;for(let f=1;f<=5;f++){let v=C[n-1][f];v+=hand==='r'?(f===5?0:1):(f===1?0:1.2);if(v<bv){bv=v;best=f;}}

function chromF(m,hd){const pc=mod(m,12);if(isBlack(m))return 3;if(hd==='r')return (pc===0||pc===5)?2:1;return (pc===4||pc===11)?2:1;}
function scaleFingers(ms,hand){
  const pc=D.pc,n=D.n;let tab=null,src='calculada';

let D={};
function compute(){

  D.scaleKs=[];for(let k=0;k<=D.n*S.oct;k++)D.scaleKs.push(k);
  const rT=D.scaleKs.map(tone),lT=rT.map(t=>shiftO(t,-1));

  // arpegio
  const ac=chordAt(S.sel,S.arpType),offs=OFFS[S.arpType],inv=Math.min(S.inv,offs.length-1);

  for(let o=-1;o<=S.oct+1;o++)offs.forEach(x=>{const k=S.sel+x+D.n*o;if(k>=start&&k<=end)ks.add(k);});
  const aK=[...ks].sort((a,b)=>a-b),aR=aK.map(tone),aL=aR.map(t=>shiftO(t,-1));
  const afr=arpFingers(aR.map(t=>t.midi),'r',ac),afl=arpFingers(aL.map(t=>t.midi),'l',ac);
  D.arpChord=ac;D.arpRun={r:aR,l:aL,fr:afr.f,fl:afl.f,src:afr.src,size:offs.length};
  // progresión con conducción de voces

  S.prog.forEach(r=>{const offs2=OFFS[S.harm],all=[];for(let o=-2;o<=3;o++)offs2.forEach(x=>all.push(r+x+D.n*o));all.sort((a,b)=>a-b);
    const uniq=[...new Set(all)];let best=null;
    for(let i=0;i+offs2.length<=uniq.length;i++){const w=uniq.slice(i,i+offs2.length).map(tone),ms=w.map(t=>t.midi);
      if(ms[0]<52||ms[ms.length-1]>79)continue;

    if(!best)best={w:OFFS[S.harm].map(x=>tone(r+x))};
    const ch=chordAt(r,S.harm);D.progV.push({ch,tones:best.w,bass:shiftO(tone(r),tone(r).midi>=60?-2:-1)});prev=best.w.map(t=>t.midi);});
}

/* ===================== audio ===================== */
let ac=null,master,an,rev,revG;
function ensureAudio(){
  if(ac){if(ac.state==='suspended')ac.resume();return;}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  master=ac.createGain();master.gain.value=0.7;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=3;
  an=ac.createAnalyser();an.fftSize=2048;
  rev=ac.createConvolver();const L=ac.sampleRate*2.2,b=ac.createBuffer(2,L,ac.sampleRate);

  master.connect(comp);master.connect(rev);rev.connect(revG);revG.connect(comp);comp.connect(an);an.connect(ac.destination);

const mtof=m=>440*Math.pow(2,(m-69)/12);
function voice(m,t,dur,vel){

    out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(vel,t+0.004);out.gain.setTargetAtTime(0,t+dur,0.09);
    for(let k=1;k<=7;k++){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f*k*(1+0.00035*k*k);
      const a=Math.pow(k,-1.5)*(k===2?1.3:1)*(f*k>9000?0:1);g.gain.setValueAtTime(a*0.55,t);g.gain.setTargetAtTime(0,t+0.01,base/(1+0.55*(k-1)));
      o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+0.6);}
    const nb=ac.createBuffer(1,ac.sampleRate*0.03,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*(1-i/nd.length);

    c.frequency.value=f;md.frequency.value=f;mg.gain.setValueAtTime(f*2.2,t);mg.gain.setTargetAtTime(f*0.25,t,0.35);
    md.connect(mg);mg.connect(c.frequency);c.connect(out);

function click(t,acc){const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=acc?1760:1100;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(acc?0.32:0.2,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);

function playNotes(ms,dur=1.2,vel=0.45){ensureAudio();const t=ac.currentTime+0.02;ms.forEach(m=>voice(m,t,dur,vel/Math.sqrt(Math.max(1,ms.length/2))));}

/* ===================== secuenciador ===================== */
let playing=false,seq=null,startT=0,nextI=0,cycle=0,tmr=null,uiT=[],spb=0.7;
let cur=null;
function buildSeq(){
  const ev=[];let t=0,len=0;
  if(S.mode==='scale'||S.mode==='arp'){
    const run=S.mode==='scale'?D.scaleRun:D.arpRun,per=S.mode==='scale'?2:run.size===4?4:3,st=1/per,N=run.r.length;
    const idx=[...Array(N).keys()];const order=S.dir==='up'?idx:idx.concat(idx.slice(0,-1).reverse());
    order.forEach((p,i)=>{const last=i===order.length-1,ms=[];if(S.hands!=='l')ms.push(run.r[p].midi);if(S.hands!=='r')ms.push(run.l[p].midi);
      ev.push({t,dur:last?1.4:st*1.15,ms,vel:0.42,ui:{kind:S.mode,p,ms,tone:S.hands==='l'?run.l[p]:run.r[p]}});t+=st;});
    len=Math.ceil(t-st+1);
  }else if(S.mode==='harm'){
    const rs=[];for(let r=0;r<=D.n;r++)rs.push(r);const order=S.dir==='up'?rs:rs.concat(rs.slice(0,-1).reverse());
    order.forEach((r,i)=>{const ch=chordAt(r,S.harm),bass=shiftO(ch.root,-1);const ms=ch.midis.concat(bass.midi);
      ev.push({t,dur:0.95,ms,vel:0.32,ui:{kind:'harm',r,ms,ch,tone:ch.root}});t+=1;});
    len=t+1;
  }else{
    if(!D.progV.length)return null;
    D.progV.forEach((v,i)=>{const ms=v.tones.map(x=>x.midi);
      ev.push({t,dur:4,ms:[v.bass.midi],vel:0.38,ui:{kind:'prog',i,ms:ms.concat(v.bass.midi),ch:v.ch,tone:v.ch.root}});

}
function play(){ensureAudio();stop(true);seq=buildSeq();if(!seq){toast('Agregá acordes a la progresión');return;}
  spb=60/S.bpm;startT=ac.currentTime+0.08;nextI=0;cycle=0;playing=true;tick();updTransport();}
function tick(){

    else{e.ms.forEach(m=>voice(m,t,e.dur*spb,e.vel/Math.sqrt(Math.max(1,e.ms.length/2))));if(e.ui)uiAt(t,()=>setCur(e.ui));}

function uiAt(t,fn){const id=setTimeout(fn,Math.max(0,(t-ac.currentTime)*1000));uiT.push(id);if(uiT.length>400)uiT=uiT.slice(-200);}

function setBpm(v){S.bpm=clamp(v,30,220);save();if(playing===true&&ac){const pos=(ac.currentTime-startT)/spb;spb=60/S.bpm;startT=ac.currentTime-pos*spb;}const e=$('#bpmv');if(e)e.textContent=S.bpm;}

let TK={};
function readTK(){const cs=getComputedStyle(document.documentElement),v=n=>cs.getPropertyValue('--'+n).trim();['paper','paperFg','paperLine','paperMute','ink','mag','cya','yel'].forEach(k=>TK[k]=v(k));}
const FC={1:'#E1C43B',2:'#2A9EBF',3:'#D12F7D',4:'#ECEBE6',5:'#121314'};
const QC={maj:['#2A9EBF','#A9DCEB','#0B0B0B'],min:['#D12F7D','#F2A9CB','#fff'],dim:['#5E5E5A','#C8C9C5','#fff'],aug:['#E1C43B','#F3E39A','#101010'],otro:['#9C9B97','#DCDCD8','#101010'],q:['#9C9B97','#DCDCD8','#101010']};

function fitCanvas(cv,W,H){const dpr=Math.min(window.devicePixelRatio||1,2.5);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.height=H+'px';const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return c;}

  for(let m=lo;m<=hi;m++)if(isBlack(m)&&map[m-1])map[m]={x:map[m-1].x+kw-bw/2,w:bw,cx:map[m-1].x+kw,black:true};return {wh,kw,bw,map};}

  while(cnt()<minW){if(s++%2){lo--;while(isBlack(lo))lo--;}else{hi++;while(isBlack(hi))hi++;}}return [lo,hi];}

function heroView(){
  const V={badges:[],fill:{},lab:{},all:[]};const on=new Set(cur?cur.ms:[]);
  const mode=cur?cur.kind:S.mode;
  if(mode==='scale'||mode==='arp'){
    const run=mode==='scale'?D.scaleRun:D.arpRun,pcs=mode==='scale'?D.pcs:new Set(D.arpChord.midis.map(m=>mod(m,12)));
    const rootPc=mode==='scale'?D.pc:mod(D.arpChord.root.midi,12);
    const show=[];if(S.hands!=='l')run.r.forEach((t,i)=>{show.push(t);V.badges.push({m:t.midi,f:run.fr[i],hand:'r',on:cur&&cur.p===i&&on.has(t.midi)});});
    if(S.hands!=='r')run.l.forEach((t,i)=>{show.push(t);V.badges.push({m:t.midi,f:run.fl[i],hand:'l',on:cur&&cur.p===i&&on.has(t.midi)});});

    for(let m=lo;m<=hi;m++){const pc=mod(m,12);if(!pcs.has(pc))continue;const isR=pc===rootPc,bl=isBlack(m);
      V.fill[m]=isR?(bl?'#D12F7D':'#F2A9CB'):(bl?'#2A9EBF':'#A9DCEB');
      let t=show.find(x=>mod(x.midi,12)===pc);if(!t)continue;

    else{ch=cur&&cur.ch?cur.ch:D.chords[S.sel];tones=ch.tones;bass=shiftO(ch.root,-1);}
    const q=QC[ch.qual];V.all=tones.map(t=>t.midi).concat(bass.midi);const [lo,hi]=range(V.all.concat([V.all[0]-5,V.all[0]+16]),15);V.lo=lo;V.hi=hi;

    c.fillStyle=b.f===5?'#ECEBE6':'#101010';c.font=`700 ${Math.round(rr*1.15)}px "IBM Plex Mono",monospace`;c.textAlign='center';c.textBaseline='middle';c.fillText(b.f,k.cx,y+1);});
  if(V.chord){c.font='700 12px "IBM Plex Mono",monospace';c.fillStyle='#ECEBE6';c.textAlign='left';c.fillText(V.chord.roman+'  '+V.chord.name+'  ·  '+V.chord.chain,4,band/2);}
}
function staffData(){

  if(mode==='scale'){const n=D.n;for(let k=0;k<=n;k++)ev.push([tone(k)]);if(cur){const k=D.scaleKs[cur.p];hl=k>0&&k%n===0?n:k%n;}}

function drawStaff(id='#staff',data){

  const c=fitCanvas(cv,W,H);c.clearRect(0,0,W,H);const Y=d=>pad+(topD-d)*g/2;const fg=TK.paperFg;

  if(sh){c.font='600 10px "IBM Plex Mono",monospace';c.fillText(sh>0?'8vb':'8va',10,Y(botD)+12);}

  inn.append(h('div',{class:'lbl'},'Elegí una progresión o sumá acordes con + PROG'),chips,h('div',{id:'progbox'}));
  return el;
}
function markPresets(){document.querySelectorAll('#s5 .chip').forEach(c=>{c.classList.remove('act','playing');c.setAttribute('aria-pressed','false');});
  const ps=[...document.querySelectorAll('#s5 .chip')];let i=0;PRESETS.forEach(([l,p])=>{const arr=p||[...Array(D.n).keys()];if(arr.some(x=>x>=D.n))return;const c=ps[i++];
    if(c&&arr.length===S.prog.length&&arr.every((x,j)=>x===S.prog[j])){c.classList.add('act');c.setAttribute('aria-pressed','true');}});}
function renderProg(){markPresets();const box=$('#progbox');if(!box)return;box.innerHTML='';const pr=h('div',{class:'prog'});
  if(!D.progV.length)pr.append(h('div',{class:'empty'},'Vacía. Tocá + PROG en un acorde de la sección 04.'));
  D.progV.forEach((v,i)=>{const q=QC[v.ch.qual];pr.append(h('div',{class:'pc','data-i':i,style:`--c:${q[0]};--ct:${q[2]}`},h('div',{class:'hd'},v.ch.roman),h('div',{class:'bd'},v.ch.name),h('div',{class:'n'},v.tones.map(nm).join(' ')),
    h('button',{class:'x',type:'button','aria-label':'Quitar',style:`color:${q[2]}`,onclick:()=>{S.prog.splice(i,1);save();compute();renderProg();restart();}},'×')));});
  if(D.progV.length)box.append(h('div',{class:'pnow',id:'pnow'}));
  box.append(pr,h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'btn sm',type:'button',onclick:()=>{S.prog=[];save();compute();renderProg();stop();}},'Vaciar'),
    h('span',{class:'note',style:'margin:0;color:var(--pm)'},'Cada acorde dura un compás de 4/4. Las voces se mueven a la inversión más cercana.')));
  updNow(cur&&cur.kind==='prog'?cur.i:-1);if(S.mode==='prog')drawAll();}
function updNow(i){const el=$('#pnow');if(!el||!D.progV.length)return;const live=i>=0,v=D.progV[Math.max(0,i)],q=QC[v.ch.qual];
  el.style.setProperty('--c',q[0]);el.innerHTML='';
  const bars=h('div',{class:'bars','aria-hidden':'true'});D.progV.forEach((_,j)=>bars.append(h('i',{class:live&&j===i?'on':live&&j<i?'done':''})));
  const cv=h('canvas',{'aria-hidden':'true'});
  el.append(h('div',{class:'st'},h('span',null,live?h('b',null,'● Sonando'):'Primer acorde · tocá ▶ en loop'),h('span',null,'Compás '+(Math.max(0,i)+1)+' / '+D.progV.length)),
    h('div',{class:'rn'},v.ch.roman),h('div',{style:'min-width:0'},h('div',{class:'nmc'},v.ch.name),h('div',{class:'tn'},v.tones.map(nm).join(' · ')+'  ·  bajo '+nm(v.bass)),h('div',{class:'tn'},QN[v.ch.qual]+' · '+v.ch.chain)),
    cv,bars);
  requestAnimationFrame(()=>drawMini(cv,{midis:v.tones.map(t=>t.midi).concat(v.bass.midi),qual:v.ch.qual},54));}
function renderTransport(){
  const el=$('#tr');el.innerHTML='';
  const pb=h('button',{class:'playbtn'+(playing?' on':''),id:'pb',type:'button',onclick:()=>{playing?stop():play();}},playing?'■ STOP':'▶ PLAY');
  const lb=h('button',{class:'btn loopbtn',type:'button','aria-pressed':String(S.loop),onclick:e=>{S.loop=!S.loop;save();e.currentTarget.setAttribute('aria-pressed',S.loop);if(playing==='ending'&&S.loop)play();}},'⟲ LOOP');
  const beat=h('div',{class:'beat',id:'beat','aria-hidden':'true'},h('i'),h('i'),h('i'),h('i'));
  const tg=(k,c)=>h('div',{class:'tg'},h('span',{class:'k'},k),c);
  const CY=['#2A9EBF','#0B0B0B'],YE=['#E1C43B','#101010'],MG=['#D12F7D','#fff'],PA=['#ECEBE6','#101010'];
  const col=(sg,cs)=>{[...sg.children].forEach((b,i)=>{const c=cs[i%cs.length];b.style.setProperty('--on',c[0]);b.style.setProperty('--onT',c[1]);});return sg;};
  const met=h('button',{class:'btn',type:'button','aria-pressed':String(S.met),onclick:e=>{S.met=!S.met;save();e.currentTarget.setAttribute('aria-pressed',S.met);}},'MET');
  const bpm=h('div',{class:'bpmg'},h('button',{class:'btn sm',type:'button','aria-label':'Bajar tempo',onclick:()=>setBpm(S.bpm-4)},'−'),h('span',{class:'bpmv',id:'bpmv'},S.bpm),h('button',{class:'btn sm',type:'button','aria-label':'Subir tempo',onclick:()=>setBpm(S.bpm+4)},'+'));
  el.append(h('div',{class:'in2'},
    h('div',{class:'trow r1'},pb,lb,met,tg('BPM',bpm),beat),
    h('div',{class:'trow r2'},col(seg([['scale','Escala'],['arp','Arpegio'],['harm','Armonizada'],['prog','Progresión']],S.mode,v=>setMode(v),'Qué suena'),[CY,YE,MG,PA])),
    h('div',{class:'trow r3'},tg('Manos',col(seg([['r','MD'],['l','MI'],['both','Ambas']],S.hands,v=>set('hands',v)),[CY,MG,YE])),
      tg('Dir',col(seg([['up','↑'],['updown','↑↓']],S.dir,v=>set('dir',v)),[CY,MG])),
      tg('Oct',col(seg([[1,'1'],[2,'2']],S.oct,v=>set('oct',v)),[YE,CY])),
      tg('Sonido',col(seg([['piano','Piano'],['ep','EP'],['pad','Pad']],S.sound,v=>{S.sound=v;save();renderTransport();}),[MG,CY,YE])))));
}
function updTransport(){const pb=$('#pb');if(pb){pb.classList.toggle('on',!!playing);pb.textContent=playing?'■ STOP':'▶ PLAY';}}
function beatLed(b){document.querySelectorAll('#beat i').forEach((e,i)=>{e.classList.toggle('on',b>=0&&b%4===i);e.classList.toggle('a',i===0);});}
function readout(chOverride){
  $('#ro-s').textContent=nm(D.tones[0])+' '+D.sc.name.replace(/ \(.*\)/,'');
  const t=cur&&cur.tone;$('#ro-n').textContent=t?nm(t):'—';$('#ro-g').textContent=t?tokFmt(t.tok):'—';
  const ch=chOverride||(cur&&cur.ch)||(S.mode==='arp'?D.arpChord:(S.mode==='harm'?D.chords[S.sel]:null));$('#ro-c').textContent=ch?ch.roman+' '+ch.name:'—';
}
function setCur(ui){cur=ui;drawTopKb();drawHero();drawStaff();drawScaleStaff();drawClock();readout();
  document.querySelectorAll('#notes .nt').forEach(e=>e.classList.toggle('on',!!(ui.tone&&+e.dataset.pc===mod(ui.tone.midi,12))&&(ui.kind==='scale')));
  document.querySelectorAll('#ftab .fcell').forEach(e=>e.classList.toggle('on',(ui.kind==='scale'||ui.kind==='arp')&&+e.dataset.i===ui.p));
  document.querySelectorAll('.card').forEach(e=>e.classList.toggle('on',ui.kind==='harm'&&+e.dataset.r===mod(ui.r,D.n)));
  document.querySelectorAll('.pc').forEach(e=>{const o=ui.kind==='prog'&&+e.dataset.i===ui.i;e.classList.toggle('on',o);if(o)e.parentElement.scrollTo({left:e.offsetLeft-e.parentElement.offsetLeft-40,behavior:'smooth'});});if(ui.kind==='prog'){updNow(ui.i);document.querySelectorAll('.chip.act').forEach(c=>c.classList.add('playing'));document.querySelectorAll('.chip.act .rns span').forEach(e=>e.classList.toggle('on',+e.dataset.j===ui.i));}}
function drawAll(){if(!D.tones)return;drawTopKb();drawHero();drawStaff();drawScaleStaff();drawClock();document.querySelectorAll('.card canvas').forEach(cv=>drawMini(cv,D.chords[+cv.dataset.r]));}
function renderAll(){
  const m=$('#main'),y=scrollY;m.innerHTML='';m.append(secScale(),secKeys(),secArp(),secHarm(),secProg());renderProg();renderTransport();renderBar();readout();
  requestAnimationFrame(()=>{drawAll();});
}
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.target.closest('input,textarea,button,select')){e.preventDefault();playing?stop():play();}});
let rz=0;addEventListener('resize',()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(drawAll);});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{readTK();drawAll();});
if(S.theme!=='system')document.documentElement.dataset.theme=S.theme;
readTK();compute();renderAll();
if(document.fonts)document.fonts.ready.then(drawAll);
